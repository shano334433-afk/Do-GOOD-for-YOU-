<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do App — Test Harness</title>
  <style>
    body{font-family:system-ui,Arial;margin:20px;background:#f6f8fa;color:#111}
    .report{max-width:800px;margin:0 auto;background:#fff;padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
    .pass{color:green} .fail{color:red}
    ul{padding-left:20px}
    pre{background:#f3f4f6;padding:8px;border-radius:6px;overflow:auto}
  </style>
</head>
<body>
  <div class="report">
    <h1>To‑Do App — Small Unit Test Harness</h1>
    <p>This harness runs a few DOM + localStorage tests against the same app code used in the demo. Place this file in the same folder as <code>index.html</code>, <code>app.js</code>, and <code>styles.css</code>, then open this file in a browser.</p>

    <div id="results"></div>

    <h3>Console output</h3>
    <pre id="log"></pre>
  </div>

  <!-- Minimal app UI used for tests (same structure as index.html) -->
  <main style="display:none">
    <form id="new-todo-form"><input id="new-todo" /></form>
    <ul id="todo-list"></ul>
  </main>

  <!-- Load the app logic (assumes app.js is in the same directory) -->
  <script src="app.js" defer></script>

  <script>
    // Simple test runner
    const out = document.getElementById('results');
    const logEl = document.getElementById('log');
    const logs = [];
    function writeLog(...args){ logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ')); logEl.textContent = logs.join('\n'); }

    function assert(cond, message){
      if(!cond) throw new Error(message || 'Assertion failed');
    }
    function pass(name){ const li = document.createElement('div'); li.innerHTML = '✓ <span class="pass">'+name+'</span>'; out.appendChild(li); writeLog('PASS:', name); }
    function fail(name, err){ const li = document.createElement('div'); li.innerHTML = '✕ <span class="fail">'+name+'</span> — '+String(err); out.appendChild(li); writeLog('FAIL:', name, err.message || err); }

    // Run tests after the app initializes
    document.addEventListener('DOMContentLoaded', async () => {
      // Wait briefly for the app's setup in app.js to finish
      await new Promise(r => setTimeout(r, 120));

      try {
        // Ensure a clean storage state
        localStorage.removeItem('todoApp.todos');
        load(); // app function that populates state.todos from LS
        assert(Array.isArray(state.todos) && state.todos.length === 0, 'state should start empty after clearing localStorage');
        pass('Clean start');

        // Test 1: Add todo(s) and verify DOM and state
        addTodo('Test A');
        addTodo('Test B');
        assert(state.todos.length === 2, 'two todos should be in state after addTodo');
        pass('addTodo updates state');

        // Check DOM rendered items
        const listItems = document.querySelectorAll('#todo-list .todo-item');
        assert(listItems.length === 2, 'two .todo-item elements should be rendered');
        pass('render reflects state');

        // Test 2: toggleComplete flips completed flag
        const id = state.todos[0].id;
        const initial = state.todos[0].completed;
        toggleComplete(id);
        assert(state.todos.find(t => t.id === id).completed === !initial, 'toggleComplete should toggle completed');
        pass('toggleComplete toggles state');

        // Test 3: removeTodo removes item
        const removeId = state.todos[0].id;
        removeTodo(removeId);
        assert(!state.todos.find(t => t.id === removeId), 'removed todo should not exist in state');
        pass('removeTodo removes item');

        // Test 4: persistence (save/load)
        // create two todos, ensure saved, then clear in-memory state and load from localStorage
        localStorage.removeItem('todoApp.todos');
        state.todos = [];
        save();
        addTodo('Persist 1');
        addTodo('Persist 2');
        assert(state.todos.length === 2, 'two todos before reload');
        // Simulate a fresh app load
        state.todos = [];
        load();
        assert(state.todos.length === 2, 'load should restore two persisted todos');
        pass('save/load persistence');

      } catch (err) {
        fail('Test suite', err);
        console.error(err);
      } finally {
        writeLog('Final state:', state.todos);
      }
    });
  </script>
</body>
</html>
